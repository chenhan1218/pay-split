name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          web/package-lock.json

    - name: Install Root Dependencies
      run: npm ci

    - name: Install Web Dependencies
      run: |
        cd web
        npm ci

    - name: Check Formatting (Prettier)
      run: npx prettier --check .

    - name: Lint Web
      run: |
        cd web
        npm run lint

    - name: Type Check Web
      run: |
        cd web
        npm run type-check

    - name: Test Web
      run: |
        cd web
        npm run test -- --coverage
