name: CI

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json

      - name: Install Root Dependencies
        run: npm ci

      - name: Check Formatting (Prettier)
        run: npm run format

      - name: Lint Web
        run: npm run lint --workspace=web

      - name: Type Check Web
        run: npm run type-check --workspace=web

      - name: Test Web
        run: npm run test --workspace=web -- --coverage
